# Rules for the External Secrets Operator (https://external-secrets.io).
checks:
  - name: externalsecret-store
    description: The secret store an ExternalSecret names exists.
    from: {group: external-secrets.io, kind: ExternalSecret}
    reference:
      name: spec.secretStoreRef.name
      to:
        group: external-secrets.io
        kind: SecretStore
        # secretStoreRef.kind may say ClusterSecretStore, which has no namespace.
        kindField: spec.secretStoreRef.kind
        clusterScoped: [ClusterSecretStore]
