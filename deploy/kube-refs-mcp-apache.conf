# Send /mcp to the kube-refs-mcp service. Include this inside the site's
# HTTPS <VirtualHost>, e.g.
#
#   Include /etc/apache2/kube-refs-mcp-apache.conf
#
# Needs: a2enmod proxy proxy_http
#
# Leave ProxyPreserveHost off (the default). kube-refs-mcp refuses
# requests that arrive on localhost with another site's Host header.
ProxyPass        /mcp http://127.0.0.1:8089/mcp timeout=90
ProxyPassReverse /mcp http://127.0.0.1:8089/mcp

# A call carries at most 4MiB of manifests (--max-manifest-bytes),
# JSON-encoded.
<Location /mcp>
    LimitRequestBody 8500000
</Location>
